<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap + Vite</title>
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <div id="app">

      <nav class="navbar navbar-expand-md navbar-custom border-bottom border-secondary" data-bs-theme="light">
        <div class="container">
          <img src="https://logos-world.net/wp-content/uploads/2023/11/Bring-Me-the-Horizon-Emblem.png" class="logoBMTH">

          <button class="navbar-toggler btn-hamborguesa" type="button" 
            data-bs-toggle="collapse" 
            data-bs-target="#menuPrincipal" 
            aria-controls="menuPrincipal" 
            aria-expanded="false" 
            aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Álbumes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Tour</a>
              </li>
            </ul>
          </div>
          
        </div>
      </nav>

    <div id="carruselBMTH" class="carousel slide" data-bs-ride="carousel">

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carruselBMTH" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carruselBMTH" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carruselBMTH" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <div class="carousel-inner">
        
        <!-- Imagen 1 -->
        <div class="carousel-item active">
          <img src="/src/assets/bmth1.png" class="d-block w-100 carrusel-img" alt="Bring Me The Horizon En Concierto">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="text-uppercase fw-bold">Post Human Era</h2>
          </div>
        </div>

        <!-- Imagen 2 -->
        <div class="carousel-item">
          <img src="/src/assets/bmth2.png" class="d-block w-100 carrusel-img" alt="Oli Sykes en directo">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="text-uppercase fw-bold">Live Tour</h2>
          </div>
        </div>

        <!-- Imagen 3 -->
        <div class="carousel-item">
          <img src="/src/assets/bmth3.png" class="d-block w-100 carrusel-img" alt="Merchandising y Estética BMTH">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="text-uppercase fw-bold">NeX GEn</h2>
          </div>
        </div>

      </div>

      <!-- botones laterales anterior / siguiente -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carruselBMTH" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carruselBMTH" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>

    </div>

    


    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
